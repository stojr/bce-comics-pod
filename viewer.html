<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCE Legacy Viewer</title>
<style>
/* ============================================================
   BCE COMICS POD — LEGACY VIEWER  (OBS Browser Source)
   Reads data/books.json. Two ways to drive it:
     • ARROW KEYS  ← →   flip between books live (focus the source,
       or use an off-screen browser window)
     • URL PARAM   viewer.html?i=12   jump straight to book #12
       (use one OBS browser source per scene, each with its own ?i=)
   Press  R  to toggle a read/unread filter. Press  S  to jump to
   the first un-verified book (handy while enriching ranges).
   ============================================================ */
:root{
  --ink:#f4f1e8; --ink-soft:#a9b0bd; --ink-faint:#8b95a3;
  --line:rgba(244,241,232,.14);
  --owned:#3ec7a8; --avail:#e8a13c; --none:#5a6270;
  --hero:#e23636; --hero-deep:#a31f1f; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
/* Center the fixed 1920x1080 design canvas inside whatever viewport we're in.
   OBS creates the browser source at exactly 1920x1080 so the scale factor is 1
   (pixel-perfect, unchanged); a normal browser window scales the whole slide to fit. */
body{display:flex;align-items:center;justify-content:center;}
.stage{width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;padding:64px 96px;transform-origin:center center;}
.card{width:1180px;background:linear-gradient(180deg,#161a21 0%,#11141a 100%);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;position:relative;}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,var(--hero) 0%,var(--hero-deep) 100%);}
.head{display:flex;align-items:center;justify-content:space-between;
  padding:26px 40px 18px 48px;border-bottom:1px solid var(--line);}
.series{font-size:15px;letter-spacing:.32em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;}
.series .legacy{color:var(--hero);}
.counter{font-size:13px;letter-spacing:.14em;color:var(--ink-faint);font-family:"SF Mono",ui-monospace,monospace;}
.pod-mark{font-size:13px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.pod-mark .dot{width:7px;height:7px;border-radius:50%;background:var(--hero);}
.body{display:flex;gap:36px;padding:32px 48px 8px;}
.cover-well{flex:0 0 230px;height:345px;border-radius:8px;background:#0c0e13;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.cover-well img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-well .ph{color:var(--ink-faint);font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:14px;}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.badge{font-size:14px;font-weight:700;letter-spacing:.04em;padding:6px 14px;border-radius:7px;text-transform:uppercase;}
.badge.format{background:rgba(62,199,168,.12);color:var(--owned);border:1px solid rgba(62,199,168,.3);}
.badge.read{background:rgba(62,199,168,.16);color:var(--owned);}
.badge.unread{background:rgba(107,114,128,.18);color:var(--ink-soft);}
.badge.unverified{background:rgba(232,161,60,.16);color:var(--avail);}
.badge.copies{background:rgba(127,119,221,.18);color:#b6aef0;border:1px solid rgba(127,119,221,.35);}
.title{font-size:44px;font-weight:800;line-height:1.05;color:var(--ink);letter-spacing:-.01em;}
.subtitle{font-size:21px;color:var(--ink-soft);margin-top:8px;font-weight:500;}
.facts{display:flex;gap:44px;margin-top:24px;flex-wrap:wrap;}
.fact .k{font-size:13px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:5px;}
.fact .v{font-size:20px;color:var(--ink);font-weight:600;}
.fact .v.mono{font-family:"SF Mono",ui-monospace,monospace;letter-spacing:-.02em;}
.ruler-wrap{padding:26px 48px 10px;}
.ruler-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;}
.ruler-head .label{font-size:15px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;}
.ruler-head .span{font-size:23px;color:var(--hero);font-weight:800;font-family:"SF Mono",ui-monospace,monospace;letter-spacing:-.01em;}
.ruler{position:relative;height:72px;cursor:pointer;}
.track{position:absolute;left:0;right:0;top:26px;height:24px;border-radius:12px;background:#272e3a;border:1px solid rgba(244,241,232,.22);overflow:hidden;}
.seg{position:absolute;top:26px;height:24px;}
.seg.owned{background:rgba(62,199,168,.58);}
.seg.avail{background:rgba(232,161,60,.68);}
.seg.hero{top:21px;height:34px;border-radius:7px;background:var(--hero);border:1px solid #ff7a7a;box-shadow:0 0 0 4px rgba(226,54,54,.30),0 6px 16px rgba(226,54,54,.38);}
.tickmark{position:absolute;top:22px;height:32px;width:2px;background:rgba(244,241,232,.30);}
.tick{position:absolute;top:60px;font-size:16px;font-weight:600;color:var(--ink-soft);font-family:"SF Mono",ui-monospace,monospace;}
.here{position:absolute;top:-12px;font-size:15px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--hero);padding:3px 11px;border-radius:6px;transform:translateX(-50%);white-space:nowrap;text-transform:uppercase;box-shadow:0 3px 10px rgba(0,0,0,.45);}
.here::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--hero);}
.no-range{font-size:17px;color:var(--avail);font-style:italic;padding:18px 0;}
.legend{display:flex;gap:28px;margin-top:30px;align-items:center;}
.legend span{font-size:15px;color:var(--ink);display:flex;align-items:center;gap:9px;font-weight:500;}
.legend i{width:15px;height:15px;border-radius:4px;display:inline-block;}
.legend i.owned{background:var(--owned);} .legend i.avail{background:var(--avail);} .legend i.none{background:#272e3a;border:1px solid var(--none);}
.pod{margin:20px 48px 32px;padding:18px 22px;border-radius:10px;background:#1c2129;border:1px dashed rgba(244,241,232,.18);}
.pod .k{font-size:13px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.pod .k .mic{color:var(--hero);}
.pod .points{font-size:22px;color:var(--ink);line-height:1.5;}
.pod .points b{color:var(--ink);font-weight:700;}
.issue-range{font-size:68px;font-weight:800;color:var(--hero);letter-spacing:-.02em;line-height:1;margin:10px 0 6px;font-family:"SF Mono",ui-monospace,monospace;}
.issue-range.unset{font-size:20px;color:var(--ink-faint);font-style:italic;font-family:inherit;font-weight:400;margin:8px 0 16px;}
/* WALK-1: the explicit "one thick book = N individual issues" line */
.collects{font-size:18px;color:var(--ink-soft);margin:0 0 18px;font-weight:500;}
.collects b{color:var(--ink);font-weight:700;}
.chonk{margin-top:8px;width:130px;height:8px;border-radius:4px;background:#0c0e13;border:1px solid var(--line);overflow:hidden;}
.chonk-fill{height:100%;background:var(--owned);}
/* contents strip (prototype, ?contents=1) — the individual issues inside this book */
.contents{padding:18px 48px 10px;}
.contents-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.contents-head .label{font-size:15px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;font-weight:600;}
.contents-head .span{font-size:18px;color:var(--hero);font-weight:800;font-family:"SF Mono",ui-monospace,monospace;}
.contents-strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.issue{position:relative;border-radius:4px;overflow:hidden;background:#0c0e13;border:1px solid var(--line);flex:0 0 auto;}
.issue img{width:100%;height:100%;object-fit:cover;display:block;}
.issue .num{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;color:var(--ink);background:rgba(8,10,14,.82);padding:2px 0;font-family:"SF Mono",ui-monospace,monospace;}
.issue.ph{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;font-family:"SF Mono",ui-monospace,monospace;}
.issue.gap{opacity:.62;border-color:var(--avail);box-shadow:inset 0 0 0 2px rgba(232,161,60,.55);}  /* available, not owned */
.kbd-hint{position:absolute;bottom:20px;right:28px;font-size:12px;color:var(--ink-faint);letter-spacing:.1em;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .2s;}
body:hover .kbd-hint{opacity:.85;}   /* operator aid only — invisible on a static OBS capture */
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:16px;}
/* Series picker: hidden until the mouse is over the window, so a static OBS capture
   never shows it, but you can switch characters while previewing in a browser. */
.series-picker{position:fixed;top:12px;left:12px;z-index:20;opacity:0;transition:opacity .2s;
  background:#11141a;color:var(--ink-soft);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
body:hover .series-picker{opacity:.92;}
</style>
</head>
<body>
<select id="seriesSel" class="series-picker" aria-label="Series"></select>
<div class="stage">
  <div class="card" id="card">
    <div class="head">
      <div class="series" id="series">— <span class="legacy">· LEGACY</span></div>
      <div class="counter" id="counter">–/–</div>
      <div class="pod-mark"><span class="dot"></span> BCE COMICS POD</div>
    </div>
    <div class="body">
      <div class="cover-well" id="cover"><span class="ph">loading…</span></div>
      <div class="meta">
        <div class="badges" id="badges"></div>
        <div class="title" id="title">—</div>
        <div class="subtitle" id="subtitle">—</div>
        <div id="issue-range" class="issue-range"></div>
        <div id="collects" class="collects"></div>
        <div class="facts" id="facts"></div>
      </div>
    </div>
    <div class="ruler-wrap">
      <div class="ruler-head">
        <span class="label">Position in legacy run</span>
        <span class="span" id="rulerSpan"></span>
      </div>
      <div class="ruler" id="ruler"><div class="track"></div></div>
      <div class="legend">
        <span><i class="owned"></i> Owned</span>
        <span><i class="avail"></i> Gap — available</span>
        <span><i class="none"></i> Gap — not released</span>
        <span style="margin-left:auto;color:var(--hero)"><i style="background:var(--hero)"></i> This book</span>
      </div>
    </div>
    <div class="contents" id="contents-wrap" style="display:none">
      <div class="contents-head"><span class="label">Inside this book</span><span class="span" id="contentsSpan"></span></div>
      <div class="contents-strip" id="contentsStrip"></div>
    </div>
    <div class="pod" id="pod-section">
      <div class="k"><span class="mic">●</span> POD TALKING POINTS</div>
      <div class="points" id="pod">—</div>
    </div>
    <div class="kbd-hint">← → flip &nbsp;·&nbsp; R read filter &nbsp;·&nbsp; S next unverified</div>
  </div>
</div>

<script>
let DATA=null, books=[], idx=0, readFilter=false, currentEntry=null, contentsMode=false;

const $ = id => document.getElementById(id);
const pct = (n,max) => Math.max(0,Math.min(100,(n/max)*100));

// Scale the 1920x1080 stage to fit the current viewport (1.0 in OBS at 1920x1080).
function fitStage(){
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  const st = document.querySelector('.stage');
  if(st) st.style.transform = 'scale('+s+')';
}
window.addEventListener('resize', fitStage);

// Click the timeline to jump to the book at that position in the run.
window.addEventListener('load', ()=>{
  const r=$('ruler'); if(!r) return;
  r.addEventListener('click', e=>{
    if(!books.length || !DATA) return;
    const rect=r.getBoundingClientRect();
    const legacy=((e.clientX-rect.left)/rect.width)*(DATA.run_max||1000);
    let target=-1, best=Infinity;
    books.forEach((bk,i)=>{
      if(bk.legacy_from==null||bk.legacy_to==null) return;
      const d=(legacy>=bk.legacy_from && legacy<=bk.legacy_to) ? 0
             : Math.min(Math.abs(legacy-bk.legacy_from), Math.abs(legacy-bk.legacy_to));
      if(d<best){ best=d; target=i; }
    });
    if(target>=0){ idx=target; render(); }
  });
});

// Collapse multiple physical copies of the same book into one slide (with a ×N badge),
// so the walkthrough doesn't flip past the same edition twice. Keyed by title.
function dedupeCopies(list){
  const seen=new Map(), out=[];
  list.forEach(b=>{
    const k=(b.title||'').trim().toLowerCase();
    if(k && seen.has(k)){ const r=seen.get(k); r.copies=(r.copies||1)+1; }
    else { b.copies=1; if(k) seen.set(k,b); out.push(b); }
  });
  return out;
}

function paramIndex(){
  const p = new URLSearchParams(location.search);
  const i = parseInt(p.get('i'),10);
  return Number.isFinite(i) ? i-1 : null;  // ?i=1 == first book
}

function render(){
  if(!books.length) return;
  idx = (idx + books.length) % books.length;
  const b = books[idx];
  const max = DATA.run_max || 1000;

  $('series').innerHTML = (DATA.series||'').toUpperCase() + ' <span class="legacy">· LEGACY</span>';
  $('counter').textContent = `${idx+1}/${books.length}`;
  $('title').textContent = b.title;
  $('subtitle').textContent = [b.year, b.format].filter(Boolean).join('  ·  ');

  // badges
  let bd = `<span class="badge format">${b.format}</span>`;
  bd += b.read ? `<span class="badge read">✓ Read</span>` : `<span class="badge unread">Unread</span>`;
  if(b.copies>1) bd += `<span class="badge copies">×${b.copies} copies</span>`;
  if(!b.verified && b.legacy_from!=null) bd += `<span class="badge unverified">range unverified</span>`;
  $('badges').innerHTML = bd;

  // issue range — hero display
  const ir = $('issue-range');
  if(b.legacy_from!=null && b.legacy_to!=null){
    ir.className='issue-range';
    ir.textContent=`#${b.legacy_from} – #${b.legacy_to}`;
  }else if(b.legacy_from!=null){
    ir.className='issue-range';
    ir.textContent=`#${b.legacy_from}`;
  }else{
    ir.className='issue-range unset';
    ir.textContent='Legacy range not yet set';
  }

  // WALK-1: spell out "one thick book = N individual issues" (the core message)
  const col = $('collects'); col.textContent='';
  if(b.legacy_from!=null && b.legacy_to!=null){
    const n = b.legacy_to - b.legacy_from + 1;
    const f=document.createElement('b'); f.textContent=b.format;
    const c=document.createElement('b'); c.textContent=n;
    col.append('This ', f, ' collects ', c, ' issue'+(n!==1?'s':'')+' in one book');
    col.style.display='';
  } else { col.style.display='none'; }

  // facts — ISBN removed (internal data), Covers promoted to hero above.
  // Pages gets a "chonk" bar normalized to the thickest book in the series.
  let facts = '';
  if(b.pages){
    const maxP = Math.max(1, ...books.map(x=>x.pages||0));
    const w = Math.round((b.pages/maxP)*100);
    facts += `<div class="fact"><div class="k">Pages</div><div class="v">${b.pages.toLocaleString()}</div>`+
             `<div class="chonk"><div class="chonk-fill" style="width:${w}%"></div></div></div>`;
  }
  if(b.also_in) facts += `<div class="fact"><div class="k">Also in</div><div class="v" style="color:var(--avail)">${b.also_in}</div></div>`;
  $('facts').innerHTML = facts;

  // cover — DOM-based with a null-safe onerror (closure over the well, not this.parentNode)
  const cw = $('cover'); cw.innerHTML='';
  if(b.cover){
    const img=document.createElement('img'); img.alt='';
    img.onerror=()=>{ cw.innerHTML='<span class="ph">cover not<br>downloaded yet</span>'; };
    img.src=b.cover;                         // set via property — no attribute injection
    cw.appendChild(img);
  }else{
    cw.innerHTML='<span class="ph">no ISBN<br>cover</span>';
  }

  // ruler
  const ruler = $('ruler');
  ruler.innerHTML = '<div class="track"></div>';
  if(b.legacy_from==null){
    $('rulerSpan').textContent = 'range not set';
    ruler.innerHTML += `<div class="no-range">Legacy range not yet looked up — run enrich_legacy.py</div>`;
  }else{
    // OWNED coverage across the whole run — every book that has a range — so the rail
    // shows the shelf at a glance (green chunks toward #max), not just this one book.
    books.forEach(x=>{
      if(x.legacy_from==null||x.legacy_to==null) return;
      const s=document.createElement('div');s.className='seg owned';
      s.style.left=pct(x.legacy_from,max)+'%';
      s.style.width=Math.max(0.4,(pct(x.legacy_to,max)-pct(x.legacy_from,max)))+'%';
      ruler.appendChild(s);
    });
    // available-but-unowned gaps across the run (amber) — e.g. a solicited volume you
    // don't own yet. Drawn for every book so the rail's state is consistent slide to slide.
    books.forEach(x=>(x.gaps_avail||[]).forEach(r=>{
      const s=document.createElement('div');s.className='seg avail';
      s.style.left=pct(r[0],max)+'%';s.style.width=Math.max(0.4,(pct(r[1],max)-pct(r[0],max)))+'%';
      ruler.appendChild(s);
    }));
    // tick marks at #1 / #mid / #max
    [['#1',0],['#'+Math.round(max/2),50],['#'+max,100]].forEach(([t,p])=>{
      const mk=document.createElement('div');mk.className='tickmark';
      if(p===0)mk.style.left='0';else if(p===100)mk.style.right='0';else{mk.style.left=p+'%';mk.style.transform='translateX(-50%)';}
      ruler.appendChild(mk);
      const el=document.createElement('div');el.className='tick';el.textContent=t;
      if(p===0)el.style.left='0';else if(p===100)el.style.right='0';else{el.style.left=p+'%';el.style.transform='translateX(-50%)';}
      ruler.appendChild(el);
    });
    // THIS BOOK — bold red marker on top of the owned coverage
    const hero=document.createElement('div');hero.className='seg hero';
    hero.style.left=pct(b.legacy_from,max)+'%';
    hero.style.width=Math.max(2.4,(pct(b.legacy_to,max)-pct(b.legacy_from,max)))+'%';
    ruler.appendChild(hero);
    const here=document.createElement('div');here.className='here';
    here.style.left=pct((b.legacy_from+b.legacy_to)/2,max)+'%';
    here.textContent='THIS BOOK';ruler.appendChild(here);
    $('rulerSpan').textContent = `#${b.legacy_from} – #${b.legacy_to}`;
  }

  // contents strip (deep-dive scene) — issue covers BELOW the legacy timeline, INCLUDING
  // available-gap issues (amber/dimmed) so you can see what the run is missing.
  const cWrap=$('contents-wrap'), legendEl=document.querySelector('.legend');
  if(contentsMode && b.legacy_from!=null && b.legacy_to!=null){
    cWrap.style.display=''; if(legendEl) legendEl.style.display='none';   // legend overlaps the wall
    const sid=(currentEntry&&currentEntry.id)||'';
    const cells=[];                                       // [issue, isGap]
    for(let i=b.legacy_from;i<=b.legacy_to;i++) cells.push([i,false]);
    (b.gaps_avail||[]).forEach(g=>{ for(let i=g[0];i<=g[1];i++) cells.push([i,true]); });
    const n=cells.length;
    $('contentsSpan').textContent=`#${b.legacy_from} – #${b.legacy_to} · ${b.legacy_to-b.legacy_from+1} issues`;
    const strip=$('contentsStrip'); strip.innerHTML='';
    // size covers to fill the width AND fit a height budget, so cover + timeline + wall
    // always stay inside the 1920x1080 OBS frame whatever the issue count
    const usable=1084, gap=10, wallBudget=330;
    const rows = n<=12 ? 1 : n<=24 ? 2 : 3;
    const perRow = Math.ceil(n/rows);
    const fillW = Math.floor((usable-(perRow-1)*gap)/perRow);
    const maxW = Math.floor((wallBudget-(rows-1)*gap)/rows/1.5);
    const w = Math.max(58, Math.min(fillW, maxW));
    const h = Math.round(w*1.5);
    cells.forEach(([i,isGap])=>{
      const cell=document.createElement('div'); cell.className='issue'+(isGap?' gap':'');
      cell.style.width=w+'px'; cell.style.height=h+'px';
      const img=document.createElement('img');
      img.onerror=()=>{ cell.textContent='#'+i; cell.className='issue ph'+(isGap?' gap':''); cell.style.width=w+'px'; cell.style.height=h+'px'; };
      img.src=`covers/issues/${sid}/${i}.jpg`;
      const num=document.createElement('div'); num.className='num'; num.textContent='#'+i;
      cell.append(img,num); strip.appendChild(cell);
    });
  }else{
    cWrap.style.display='none'; if(legendEl) legendEl.style.display='';
  }

  // pod — hide section entirely when empty
  const podSection = $('pod-section');
  if(b.pod){ podSection.style.display=''; $('pod').className='points'; $('pod').innerHTML=b.pod; }
  else{ podSection.style.display='none'; }
}

function step(d){
  if(!books.length) return;
  if(readFilter && d!==0){
    let n=idx;
    for(let k=0;k<books.length;k++){ n=(n+d+books.length)%books.length; if(!books[n].read){idx=n;break;} }
  }else{ idx+=d; }
  render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1);}
  else if(e.key.toLowerCase()==='r'){
    readFilter=!readFilter;
    if(readFilter && books[idx] && books[idx].read) step(1); else render();
  }
  else if(e.key.toLowerCase()==='s'){
    const n=books.findIndex((b,i)=>i>idx && !b.verified && b.legacy_from!=null);
    if(n>=0){idx=n;render();}
  }
});

// Apply a per-series theme. The "screen background" is the page background behind the
// card — transparent by default (so OBS stays keyable), a solid color when chosen.
function applyTheme(t){
  t = t || {};
  const root = document.documentElement.style;
  document.body.style.background = (t.bg && t.bg!=='transparent') ? t.bg : 'transparent';
  if(t.accent)     root.setProperty('--hero', t.accent);
  if(t.accentDeep) root.setProperty('--hero-deep', t.accentDeep);
  if(t.ink)        root.setProperty('--ink', t.ink);
}

function populatePicker(manifest, currentId){
  const sel=$('seriesSel');
  if(!sel) return;
  if(!manifest || manifest.length < 2){ sel.style.display='none'; return; }  // nothing to switch to
  sel.innerHTML = manifest.map(e =>
    `<option value="${e.id}"${e.id===currentId?' selected':''}>${e.label}</option>`).join('');
  sel.onchange = () => {
    const p = new URLSearchParams(location.search);
    p.set('series', sel.value); p.delete('i');   // new series — drop the pinned index
    location.search = p.toString();
  };
}

async function boot(){
  fitStage();
  // fetch() is blocked over file:// — the page MUST be served over http.
  if(location.protocol==='file:'){
    $('cover').innerHTML='<span class="ph">open via<br>start.bat</span>';
    $('title').textContent='Open http://localhost:8000/viewer.html';
    $('subtitle').textContent="Double-clicking the file can't load data — run start.bat (or python serve.py), then open localhost:8000";
    return;
  }
  try{
    let manifest=[];
    try{ manifest = await (await fetch('data/series.json')).json(); }catch(e){ manifest=[]; }
    const wantId = new URLSearchParams(location.search).get('series');
    const entry = manifest.find(e=>e.id===wantId) || manifest[0] || null;
    const file = entry ? 'data/'+entry.file : 'data/books.json';   // fallback: legacy single file
    const d = await (await fetch(file)).json();
    DATA=d; books=dedupeCopies(d.books||[]);
    currentEntry = entry;
    contentsMode = new URLSearchParams(location.search).get('contents')==='1';
    applyTheme(entry && entry.theme);
    populatePicker(manifest, entry ? entry.id : null);
    const pi=paramIndex();
    if(pi!=null && books.length) idx=Math.max(0,Math.min(books.length-1,pi));  // clamp ?i=N
    render();
  }catch(err){
    $('cover').innerHTML='<span class="ph">books.json<br>not found</span>';
    $('title').textContent='Could not load series data';
    $('subtitle').textContent='Run start.bat or python serve.py, then open localhost:8000';
  }
}
boot();
</script>
