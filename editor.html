<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCE Legacy — Editor</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1f242c; --line:rgba(244,241,232,.14);
  --ink:#f4f1e8; --soft:#a9b0bd; --faint:#8b95a3;
  --hero:#e23636; --owned:#3ec7a8; --avail:#e8a13c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;height:100vh;display:flex;overflow:hidden;}
/* left: book list */
.list{width:440px;flex:0 0 440px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;}
.list .top{padding:16px 18px;border-bottom:1px solid var(--line);}
.list h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:600;}
.list .sub{font-size:12px;color:var(--faint);margin-top:4px;}
select.series{margin-top:10px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit;}
.toolbar{display:flex;gap:8px;margin-top:10px;}
.toolbar button{flex:1;background:var(--panel2);color:var(--soft);border:1px solid var(--line);
  border-radius:8px;padding:8px 6px;font-size:13px;cursor:pointer;}
.toolbar button:hover{filter:brightness(1.12);color:var(--ink);}
.search{margin-top:10px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:9px 12px;font-size:14px;}
.rows{overflow-y:auto;flex:1;}
.row{padding:11px 18px;border-bottom:1px solid rgba(244,241,232,.06);cursor:pointer;display:flex;gap:10px;align-items:center;}
.row:hover{background:var(--panel2);}
.row.active{background:var(--panel2);border-left:3px solid var(--hero);padding-left:15px;}
.row .n{font-size:12px;color:var(--faint);font-family:Consolas,monospace;width:24px;flex:0 0 24px;}
.row .t{font-size:14px;flex:1;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
.row .dot.ok{background:var(--owned);} .row .dot.seed{background:var(--avail);} .row .dot.none{background:var(--faint);}
/* right: editor */
.edit{flex:1;overflow-y:auto;padding:28px 36px;}
.edit .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:20px;}
.edit h2{font-size:24px;font-weight:700;}
.edit .ro{font-size:12px;color:var(--faint);margin-top:4px;font-family:Consolas,monospace;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:760px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:10px 12px;font-size:15px;font-family:inherit;}
input:focus,textarea:focus{outline:none;border-color:var(--hero);}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
.mono{font-family:Consolas,monospace;}
.row2{display:flex;gap:10px;align-items:center;}
.row2 input{width:90px;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);cursor:pointer;}
.chk input{width:auto;}
.cover-prev{width:230px;height:345px;flex:0 0 230px;border-radius:8px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--faint);font-size:13px;text-align:center;
  cursor:pointer;transition:border-color .14s ease;}
.cover-prev:hover{border-color:var(--hero);}
.cover-prev img{width:100%;height:100%;object-fit:cover;}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 0 8px;margin-top:28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
button{background:var(--hero);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--soft);font-weight:500;padding:9px 16px;font-size:14px;}
button:hover{filter:brightness(1.08);}
.saved{font-size:14px;color:var(--owned);opacity:0;transition:opacity .2s;}
.saved.show{opacity:1;}
.dirty{font-size:13px;color:var(--avail);margin-left:auto;}
.gaps-list{display:flex;flex-direction:column;gap:6px;}
.gap-item{display:flex;gap:8px;align-items:center;font-size:14px;}
.gap-item button{background:transparent;border:1px solid var(--line);color:var(--soft);padding:4px 10px;font-size:13px;}
.hint{font-size:12px;color:var(--faint);}
/* research */
.research-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;color:var(--soft);line-height:1.5;white-space:pre-wrap;min-height:40px;}
.research-sources{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:13px;align-items:center;}
.research-sources .lbl{color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-size:11px;}
.research-sources a{color:var(--avail);text-decoration:none;}
.research-sources a:hover{text-decoration:underline;}
.research-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.research-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);line-height:1.5;}
.research-item .src{font-size:11px;color:var(--faint);margin-top:6px;display:flex;justify-content:space-between;align-items:center;}
.research-item .src button{background:transparent;border:1px solid var(--line);color:var(--soft);padding:3px 9px;font-size:12px;}
/* settings modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.show{display:flex;}
.modal{width:460px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;}
.modal h3{font-size:18px;margin-bottom:6px;}
.modal .msub{font-size:13px;color:var(--faint);margin-bottom:20px;}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.color-row label{flex:0 0 130px;}
.color-row input[type=color]{width:46px;height:38px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:pointer;}
.color-row input.hex{width:110px;}
.modal .mactions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;}
/* pod coverage fields */
.pod-fields{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
.pod-fields .pf{display:flex;flex-direction:column;gap:4px;}
.pod-fields .pf>label{font-size:11px;}
.pod-fields input{padding:8px 10px;font-size:14px;}
.pod-combined{color:var(--avail);font-weight:700;}
/* in-editor issue-cover strip */
.issue-strip{display:flex;flex-wrap:wrap;gap:8px;max-height:360px;overflow-y:auto;padding:8px;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;}
.istrip{position:relative;width:74px;height:111px;border-radius:4px;overflow:hidden;background:#0c0e13;border:1px solid var(--line);flex:0 0 auto;}
.istrip img{width:100%;height:100%;object-fit:cover;display:block;}
.istrip .n{position:absolute;top:0;left:0;right:0;font-size:10px;text-align:center;background:rgba(8,10,14,.82);color:var(--soft);font-family:Consolas,monospace;}
.istrip.empty{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;font-family:Consolas,monospace;}
.istrip .acts{position:absolute;bottom:0;left:0;right:0;display:flex;opacity:0;transition:opacity .12s;}
.istrip:hover .acts{opacity:1;}
.istrip .acts button{flex:1;border:none;background:rgba(8,10,14,.88);color:var(--ink);font-size:13px;padding:3px 0;cursor:pointer;line-height:1;}
.istrip .acts button:hover{background:var(--hero);color:#fff;}
.istrip .acts button.del:hover{background:#c0392b;color:#fff;}
.istrip.busy{opacity:.45;pointer-events:none;}
/* new-series modal rows */
.ns-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.ns-row>label:first-child{flex:0 0 104px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.ns-row input{flex:1;min-width:0;}
.ns-modes{display:flex;flex-direction:column;gap:6px;}
</style>
</head>
<body>
<div class="list">
  <div class="top">
    <h1>Legacy Editor</h1>
    <select class="series" id="seriesSel" aria-label="Series"></select>
    <div class="sub" id="sub">loading…</div>
    <div class="toolbar">
      <button onclick="addBook()">+ Book</button>
      <button onclick="openNewSeries()">+ Series</button>
      <button onclick="openSettings()">⚙ Colors</button>
      <button onclick="reimport()" id="reimportBtn">↻ Re-import</button>
    </div>
    <input class="search" id="search" placeholder="Filter books…">
  </div>
  <div class="rows" id="rows"></div>
</div>

<div class="edit" id="edit">
  <div class="hd">
    <div>
      <h2 id="eTitle">Select a book</h2>
      <div class="ro" id="eMeta"></div>
    </div>
    <div class="cover-prev" id="coverPrev" onclick="pickCover()" title="Click to choose or replace the cover image">cover</div>
  </div>
  <div class="grid" id="form" style="display:none">
    <div class="field"><label>Title</label><input id="fTitle"></div>
    <div class="field"><label>Format</label><input id="fFormat"></div>
    <div class="field full"><label>ISBN <span class="hint">(barcode — also names the cover file)</span></label><input class="mono" id="fISBN" placeholder="9780785188346" style="max-width:300px"></div>

    <div class="field">
      <label>Legacy range (from → to)</label>
      <div class="row2">
        <input class="mono" id="fFrom" type="number" placeholder="from">
        <span style="color:var(--faint)">→</span>
        <input class="mono" id="fTo" type="number" placeholder="to">
      </div>
    </div>
    <div class="field">
      <label>Status</label>
      <label class="chk"><input type="checkbox" id="fVerified"> Range verified (I confirmed this)</label>
      <label class="chk"><input type="checkbox" id="fRead"> Read</label>
    </div>

    <div class="field full">
      <label>Gaps that are available but unowned (amber bars)</label>
      <div class="gaps-list" id="gapsList"></div>
      <div class="row2" style="margin-top:6px">
        <input class="mono" id="gapFrom" type="number" placeholder="from">
        <span style="color:var(--faint)">→</span>
        <input class="mono" id="gapTo" type="number" placeholder="to">
        <button class="ghost" type="button" onclick="addGap()">+ add gap</button>
      </div>
    </div>

    <div class="field full">
      <label>Pod talking points <span class="hint">(use · to separate; &lt;b&gt;bold&lt;/b&gt; allowed)</span></label>
      <textarea id="fPod" placeholder="First Sinister Six · Ditko run · why the Epic line starts here"></textarea>
    </div>

    <div class="field full">
      <label>BCE Pod coverage <span class="hint">(when covered, a badge + ratings show on the slide)</span></label>
      <label class="chk"><input type="checkbox" id="fPodCovered"> Covered on the BCE Pod</label>
      <div class="pod-fields" id="podFields" style="display:none">
        <div class="pf"><label>Episode aired</label><input id="fPodAired" type="month" style="width:170px"></div>
        <div class="pf"><label>Nick (0–10)</label><input id="fPodNick" type="number" min="0" max="10" step="0.1" style="width:110px"></div>
        <div class="pf"><label>Stojr (0–10)</label><input id="fPodStojr" type="number" min="0" max="10" step="0.1" style="width:110px"></div>
        <div class="pf"><label>Combined</label><input id="fPodCombined" class="pod-combined" readonly tabindex="-1" style="width:90px"></div>
        <div class="pf" style="flex:1 1 100%"><label>YouTube link</label><input class="mono" id="fPodYoutube" placeholder="https://youtu.be/…"></div>
      </div>
    </div>

    <div class="field full">
      <label>Web research <span class="hint">(looks up the volume/issues; saved notes appear below)</span></label>
      <div class="row2" style="margin-bottom:8px">
        <button class="ghost" type="button" onclick="research()">🔎 Research this volume</button>
        <span class="hint" id="researchStatus"></span>
      </div>
      <div class="research-box" id="researchOut">No lookup yet.</div>
      <div class="research-sources" id="researchSources"></div>
      <div class="row2" style="margin-top:8px">
        <button class="ghost" type="button" id="researchAdd" style="display:none" onclick="addResearch()">+ save to book</button>
      </div>
      <div class="research-list" id="researchList"></div>
    </div>

    <div class="field full">
      <label>Also available in (alt-format note)</label>
      <input id="fAlso" placeholder="Omnibus Vol. 1">
    </div>

    <div class="field full">
      <label>Cover image <span class="hint">(click the cover box above or the button to pick a file — it's copied into covers/ for you)</span></label>
      <div class="row2">
        <input class="mono" id="fCover" placeholder="covers/9780785188346.jpg" style="flex:1;width:auto">
        <button class="ghost" type="button" onclick="pickCover()">📁 Choose image…</button>
      </div>
      <input type="file" id="coverFile" accept="image/*" style="display:none">
    </div>

    <div class="field full" id="issueStripWrap" style="display:none">
      <label>Issue covers <span class="hint">(the deep-dive wall — hover a cover: ↻ re-download · ✕ remove)</span></label>
      <div class="issue-strip" id="issueStrip"></div>
      <div class="hint" id="issueStripMsg" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="actions" id="actions" style="display:none">
    <button onclick="saveAll()">Save changes</button>
    <button class="ghost" onclick="moveBook(-1)">↑ Move up</button>
    <button class="ghost" onclick="moveBook(1)">↓ Move down</button>
    <button class="ghost" onclick="deleteBook()">Delete book</button>
    <button class="ghost" onclick="revert()">Revert</button>
    <span class="saved" id="saved">✓ saved (backup made)</span>
    <span class="dirty" id="dirtyFlag" style="display:none">● unsaved changes</span>
  </div>
</div>

<!-- settings / colors modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Colors for <span id="themeSeries">this series</span></h3>
    <div class="msub">Saved to the series so the OBS viewer reflects it on refresh.</div>
    <div class="color-row">
      <label>Screen background</label>
      <input type="color" id="bgColor" value="#0c0e13">
      <input class="hex mono" id="bgHex" placeholder="#0c0e13">
      <button class="ghost" id="bgEye" type="button">⊙ pick</button>
    </div>
    <label class="chk" style="margin:-6px 0 16px"><input type="checkbox" id="bgTransparent"> Transparent (keyable in OBS)</label>
    <div class="color-row">
      <label>Accent (hero)</label>
      <input type="color" id="accentColor" value="#e23636">
      <input class="hex mono" id="accentHex" placeholder="#e23636">
      <button class="ghost" id="accentEye" type="button">⊙ pick</button>
    </div>
    <div class="mactions">
      <button class="ghost" onclick="closeSettings()">Cancel</button>
      <button onclick="saveTheme()">Save colors</button>
    </div>
  </div>
</div>

<!-- new series modal -->
<div class="overlay" id="nsOverlay">
  <div class="modal">
    <h3>New series</h3>
    <div class="msub">Adds a shelf to the viewer/editor. The ID is permanent (it names the data file).</div>
    <div class="ns-row"><label>Series ID</label><input class="mono" id="nsId" placeholder="xmen"></div>
    <div class="ns-row"><label>Display label</label><input id="nsLabel" placeholder="Uncanny X-Men"></div>
    <div class="ns-row"><label>Ruler max #</label><input id="nsRunMax" type="number" value="1000" style="flex:0 0 120px"></div>
    <div class="ns-row"><label>Source</label>
      <div class="ns-modes">
        <label class="chk"><input type="radio" name="nsMode" value="empty" checked> Empty — add books by hand</label>
        <label class="chk"><input type="radio" name="nsMode" value="clz"> Import from a CLZ CSV export</label>
      </div>
    </div>
    <div id="nsClz" style="display:none">
      <div class="ns-row"><label>CSV file</label><input class="mono" id="nsCsv" placeholder="export_comics.csv"></div>
      <div class="ns-row"><label>Series Group</label><input id="nsGroup" placeholder="X-Men: Uncanny"></div>
      <div class="ns-row"><label>Storage Box</label><input id="nsBox" placeholder="Bookshelf"></div>
    </div>
    <div class="mactions">
      <button class="ghost" onclick="closeNewSeries()">Cancel</button>
      <button onclick="createSeries()" id="nsCreate">Create series</button>
    </div>
  </div>
</div>

<script>
const state = { manifest: [], series: null, DATA: null, cur: -1, dirty: false };
let DATA = null, cur = -1, dirtySnapshot = null, lastResearch = null;
const $ = id => document.getElementById(id);

function markDirty(){ state.dirty = true; $('dirtyFlag').style.display=''; }
function clearDirty(){ state.dirty = false; $('dirtyFlag').style.display='none'; }

function dot(b){
  if(b.legacy_from==null) return 'none';
  return b.verified ? 'ok' : 'seed';
}

function renderList(filter=''){
  const rows=$('rows'); rows.innerHTML='';
  DATA.books.forEach((b,i)=>{
    if(filter && !((b.title||'').toLowerCase().includes(filter)||(b.format||'').toLowerCase().includes(filter))) return;
    const el=document.createElement('div');
    el.className='row'+(i===cur?' active':'');
    const n=document.createElement('span'); n.className='n'; n.textContent=i+1;
    const d=document.createElement('span'); d.className='dot '+dot(b);
    const t=document.createElement('span'); t.className='t'; t.textContent=b.title||'(untitled)';  // textContent: no HTML injection
    el.append(n,d,t);
    el.onclick=()=>userSelect(i);
    rows.appendChild(el);
  });
}

// user clicked a row — flush the current form first so edits aren't lost (EDIT-1 fix)
function userSelect(i){
  if(cur>=0 && $('form').style.display!=='none') collect();
  select(i);
}

function select(i){
  cur=i; state.cur=i; const b=DATA.books[i];
  dirtySnapshot=JSON.parse(JSON.stringify(b));
  $('form').style.display='grid'; $('actions').style.display='flex';
  $('eTitle').textContent=b.title||'(untitled)';
  $('eMeta').textContent=[b.id,b.isbn,b.year,b.pages?b.pages+'p':''].filter(Boolean).join('  ·  ');
  $('fTitle').value=b.title||'';
  $('fFormat').value=b.format||'';
  $('fISBN').value=b.isbn||'';
  $('fFrom').value=b.legacy_from??'';
  $('fTo').value=b.legacy_to??'';
  $('fVerified').checked=!!b.verified;
  $('fRead').checked=!!b.read;
  $('fPod').value=b.pod||'';
  $('fAlso').value=b.also_in||'';
  $('fCover').value=b.cover||'';
  renderGaps(b);
  renderResearch(b);
  $('researchOut').textContent='No lookup yet.'; $('researchAdd').style.display='none'; $('researchStatus').textContent=''; $('researchSources').innerHTML='';
  showCoverPreview(b.cover, false);
  // pod coverage
  const pcv=b.pod_coverage||{};
  $('fPodCovered').checked=!!pcv.covered;
  $('fPodAired').value=pcv.aired||'';
  $('fPodNick').value=(pcv.rating_nick!=null)?pcv.rating_nick:'';
  $('fPodStojr').value=(pcv.rating_stojr!=null)?pcv.rating_stojr:'';
  $('fPodYoutube').value=pcv.youtube||'';
  togglePodFields(); updatePodCombined();
  renderIssueStrip(b);
  renderList($('search').value.toLowerCase());
}

function renderGaps(b){
  const gl=$('gapsList'); gl.innerHTML='';
  (b.gaps_avail||[]).forEach((g,gi)=>{
    const el=document.createElement('div'); el.className='gap-item';
    const span=document.createElement('span'); span.className='mono'; span.textContent=`#${g[0]} → #${g[1]}`;
    const btn=document.createElement('button'); btn.type='button'; btn.textContent='remove'; btn.onclick=()=>removeGap(gi);
    el.append(span,btn); gl.appendChild(el);
  });
  if(!(b.gaps_avail||[]).length) gl.innerHTML='<span class="hint">none</span>';
}

function renderResearch(b){
  const rl=$('researchList'); rl.innerHTML='';
  (b.research||[]).forEach((r,ri)=>{
    const el=document.createElement('div'); el.className='research-item';
    const txt=document.createElement('div'); txt.textContent=r.text||'';   // textContent: web text is untrusted (SEC-3)
    const src=document.createElement('div'); src.className='src';
    const lbl=document.createElement('span'); lbl.textContent=[r.source,r.fetched_at].filter(Boolean).join(' · ');
    const rm=document.createElement('button'); rm.type='button'; rm.textContent='remove'; rm.onclick=()=>{ b.research.splice(ri,1); renderResearch(b); markDirty(); };
    src.append(lbl,rm); el.append(txt,src); rl.appendChild(el);
  });
}

function collect(){
  if(cur<0) return;
  const b=DATA.books[cur];
  b.title=$('fTitle').value.trim();
  b.format=$('fFormat').value.trim();
  b.isbn=$('fISBN').value.trim();
  const f=$('fFrom').value, t=$('fTo').value;
  b.legacy_from = f===''?null:parseInt(f,10);
  b.legacy_to   = t===''?null:parseInt(t,10);
  // validation: if one of from/to is set, require both; enforce from<=to (EDIT-2)
  if(b.legacy_from!=null && b.legacy_to!=null && b.legacy_from>b.legacy_to){
    [b.legacy_from,b.legacy_to]=[b.legacy_to,b.legacy_from];
  }
  b.verified=$('fVerified').checked;
  b.read=$('fRead').checked;
  b.pod=$('fPod').value.trim();
  b.also_in=$('fAlso').value.trim();
  b.cover=$('fCover').value.trim();
  // pod coverage — keep an object only if there's something meaningful in it
  const covered=$('fPodCovered').checked;
  const nick=parseFloat($('fPodNick').value), stojr=parseFloat($('fPodStojr').value);
  const pc={ covered:covered, aired:$('fPodAired').value||'', youtube:$('fPodYoutube').value.trim(),
             rating_nick:isNaN(nick)?null:nick, rating_stojr:isNaN(stojr)?null:stojr };
  if(covered||pc.aired||pc.youtube||pc.rating_nick!=null||pc.rating_stojr!=null) b.pod_coverage=pc;
  else delete b.pod_coverage;
  markDirty();
}

function addGap(){
  const f=parseInt($('gapFrom').value,10), t=parseInt($('gapTo').value,10);
  if(Number.isFinite(f)&&Number.isFinite(t)){
    const lo=Math.min(f,t), hi=Math.max(f,t);
    const b=DATA.books[cur]; (b.gaps_avail=b.gaps_avail||[]).push([lo,hi]);
    $('gapFrom').value=''; $('gapTo').value=''; renderGaps(b); markDirty();
  }
}
function removeGap(gi){ const b=DATA.books[cur]; b.gaps_avail.splice(gi,1); renderGaps(b); markDirty(); }

// ---- pod coverage (#2a) ----
function togglePodFields(){ $('podFields').style.display = $('fPodCovered').checked ? 'flex' : 'none'; }
function updatePodCombined(){
  const vals=[parseFloat($('fPodNick').value), parseFloat($('fPodStojr').value)].filter(v=>!isNaN(v));
  $('fPodCombined').value = vals.length ? (vals.reduce((a,c)=>a+c,0)/vals.length).toFixed(1) : '';
}

// ---- in-editor issue-cover strip (#2b) ----
function renderIssueStrip(b){
  const wrap=$('issueStripWrap'), strip=$('issueStrip'), msg=$('issueStripMsg');
  const sid=(state.series&&state.series.id)||'';
  if(!sid || b.legacy_from==null || b.legacy_to==null){ wrap.style.display='none'; return; }
  wrap.style.display=''; strip.innerHTML='';
  const nums=[];
  for(let i=b.legacy_from;i<=b.legacy_to;i++) nums.push(i);
  (b.gaps_avail||[]).forEach(g=>{ for(let i=g[0];i<=g[1];i++) if(!nums.includes(i)) nums.push(i); });
  const cap=300, shown=nums.slice(0,cap);
  msg.textContent=`${nums.length} issue${nums.length!==1?'s':''} · covers/issues/${sid}/`+(nums.length>cap?` (showing first ${cap})`:'');
  shown.forEach(n=>strip.appendChild(issueCell(sid,n)));
}
function issueCell(sid,n){
  const cell=document.createElement('div'); cell.className='istrip';
  const img=document.createElement('img');
  const num=document.createElement('div'); num.className='n'; num.textContent='#'+n;
  img.onerror=()=>{ cell.className='istrip empty'; cell.innerHTML=''; const t=document.createElement('span'); t.textContent='#'+n; cell.append(t, issueActs(sid,n,cell)); };
  img.src=`covers/issues/${sid}/${n}.jpg?t=${Date.now()}`;     // cache-bust so a re-download shows at once
  cell.append(img,num,issueActs(sid,n,cell));
  return cell;
}
function issueActs(sid,n,cell){
  const w=document.createElement('div'); w.className='acts';
  const re=document.createElement('button'); re.type='button'; re.textContent='↻'; re.title='re-download from Comic Vine';
  re.onclick=e=>{ e.stopPropagation(); issueAction('refetch-issue',sid,n,cell); };
  const del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent='✕'; del.title='remove this cover';
  del.onclick=e=>{ e.stopPropagation(); issueAction('delete-issue',sid,n,cell); };
  w.append(re,del); return w;
}
async function issueAction(kind,sid,n,cell){
  cell.classList.add('busy');
  try{
    const r=await fetch(`/api/${kind}?series=${encodeURIComponent(sid)}&n=${n}`,{method:'POST'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status));
    cell.replaceWith(issueCell(sid,n));    // re-render the one cell from disk
  }catch(e){ cell.classList.remove('busy'); alert((kind==='refetch-issue'?'Re-download':'Remove')+' failed for #'+n+':\\n\\n'+e.message); }
}

// ---- new series (#2c) ----
function openNewSeries(){
  $('nsId').value=''; $('nsLabel').value=''; $('nsRunMax').value='1000';
  $('nsCsv').value=''; $('nsGroup').value=''; $('nsBox').value='';
  document.querySelector('input[name=nsMode][value=empty]').checked=true;
  $('nsClz').style.display='none';
  $('nsOverlay').classList.add('show');
}
function closeNewSeries(){ $('nsOverlay').classList.remove('show'); }
async function createSeries(){
  const id=$('nsId').value.trim().toLowerCase();
  const label=$('nsLabel').value.trim();
  const run_max=parseInt($('nsRunMax').value,10)||1000;
  const mode=document.querySelector('input[name=nsMode]:checked').value;
  if(!/^[a-z0-9][a-z0-9_-]{0,38}$/.test(id)){ alert('ID must be lowercase letters/numbers/-/_ and start with a letter or number.'); return; }
  if(!label){ alert('A display label is required.'); return; }
  const body={ id, label, run_max, mode };
  if(mode==='clz'){
    body.csv=$('nsCsv').value.trim(); body.series_group=$('nsGroup').value.trim(); body.box=$('nsBox').value.trim();
    if(!body.csv||!body.series_group||!body.box){ alert('CSV file, Series Group and Storage Box are all required for a CLZ import.'); return; }
  }
  const btn=$('nsCreate'); btn.textContent='…working'; btn.disabled=true;
  try{
    const r=await fetch('/api/new-series',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status));
    state.manifest=await (await fetch('data/series.json')).json();
    populateSeriesSelect(); closeNewSeries();
    await loadSeries(id); $('seriesSel').value=id; toast();
    if(j.output) alert('Series created.\\n\\n'+j.output);
  }catch(e){ alert('Could not create series:\\n\\n'+e.message); }
  finally{ btn.textContent='Create series'; btn.disabled=false; }
}

// ---- add / remove / reorder ----
function addBook(){
  if(cur>=0 && $('form').style.display!=='none') collect();
  const arr=DATA.books;
  const maxOrder=arr.reduce((m,b)=>Math.max(m,b.order||0),0);
  arr.push({ id:'book-'+Date.now().toString(36), order:maxOrder+10, title:'(new book)', format:'',
    format_raw:'', on_spine:true, year:null, era_tag:'', isbn:'', pages:null, read:false, status:'owned',
    cover:'', legacy_from:null, legacy_to:null, gaps_avail:[], also_in:'', pod:'', research:[], verified:false });
  cur=arr.length-1; markDirty(); select(cur);
}
function deleteBook(){
  if(cur<0) return;
  const b=DATA.books[cur];
  if(!confirm('Delete "'+(b.title||'this book')+'"?\\n(A timestamped backup is made when you Save.)')) return;
  DATA.books.splice(cur,1);
  renumber();
  markDirty();
  if(DATA.books.length){ cur=Math.min(cur,DATA.books.length-1); select(cur); }
  else { cur=-1; $('form').style.display='none'; $('actions').style.display='none'; $('eTitle').textContent='No books'; renderList(); }
}
function moveBook(dir){
  if(cur<0) return;
  const j=cur+dir;
  if(j<0||j>=DATA.books.length) return;
  collect();
  const arr=DATA.books; [arr[cur],arr[j]]=[arr[j],arr[cur]];
  renumber(); cur=j; markDirty(); select(cur);
}
function renumber(){ DATA.books.forEach((b,i)=>b.order=(i+1)*10); }  // gapped order by position

function revert(){
  DATA.books[cur]=JSON.parse(JSON.stringify(dirtySnapshot));
  select(cur);
}

// ---- cover preview + image picker ----
function showCoverPreview(path, bust){
  const cp=$('coverPrev'); cp.innerHTML='';
  if(path){
    const img=document.createElement('img');
    img.onerror=()=>{ cp.textContent='no cover file yet — click to pick one'; };
    img.src = bust ? (path + (path.includes('?')?'&':'?') + 't=' + Date.now()) : path;  // cache-bust a just-replaced cover
    cp.appendChild(img);
  } else { cp.textContent='click to add cover'; }
}
function pickCover(){ if(cur<0){ alert('Select a book first.'); return; } $('coverFile').click(); }
async function onCoverFile(e){
  const file=e.target.files && e.target.files[0];
  e.target.value='';                                   // reset so the same file can be re-picked
  if(!file || cur<0) return;
  const b=DATA.books[cur];
  const name=((b.isbn||'').trim() || (b.id||'').trim());   // covers/<isbn>.jpg by convention; fall back to the stable id
  if(!name){ alert('Give this book an ISBN first — the cover file is named after it.'); return; }
  const okExt=['jpg','jpeg','png','webp','gif'];
  const m=/\.([A-Za-z0-9]+)$/.exec(file.name||'');
  let ext=(m?m[1]:'').toLowerCase();
  if(!okExt.includes(ext)){
    ext = file.type==='image/png'?'png':file.type==='image/webp'?'webp':file.type==='image/gif'?'gif':'jpg';
  }
  try{
    const buf=await file.arrayBuffer();
    if(buf.byteLength>20*1024*1024){ alert('That image is over 20 MB — please pick a smaller file.'); return; }
    const q='?series='+encodeURIComponent((state.series&&state.series.id)||'')
           +'&name='+encodeURIComponent(name)+'&ext='+encodeURIComponent(ext);
    const r=await fetch('/api/cover'+q,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:buf});
    const j=await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status));
    b.cover=j.path; $('fCover').value=j.path;
    showCoverPreview(j.path, true);
    markDirty();
  }catch(err){ alert('Could not save the image — is serve.py running?\\n\\n'+err.message); }
}

// ---- web research ----
async function research(){
  if(cur<0) return;
  const b=DATA.books[cur];
  const label=(state.series&&state.series.label)||DATA.series||'';
  let url='/api/research?series='+encodeURIComponent(label)+'&title='+encodeURIComponent(b.title||'')
          +'&format='+encodeURIComponent(b.format||'')        // match the right edition, not a same-titled trade
          +'&isbn='+encodeURIComponent(b.isbn||'');
  if(b.legacy_from!=null) url+='&from='+b.legacy_from+'&to='+(b.legacy_to??'');
  $('researchOut').textContent='searching…'; $('researchStatus').textContent=''; $('researchAdd').style.display='none'; $('researchSources').innerHTML='';
  try{
    const j=await (await fetch(url)).json();
    if(j.error){ $('researchOut').textContent='error: '+j.error; return; }
    lastResearch={ text:j.summary, source:j.source };
    $('researchOut').textContent = j.summary || '(no info found)';
    $('researchStatus').textContent = j.source ? ('via '+j.source+(j.range?(' · '+j.range):'')) : '';
    $('researchAdd').style.display = j.summary ? '' : 'none';
    // authoritative verification links (PRH, Marvel Database/Omnibus wiki, Wikipedia, Marvel.com)
    const rs=$('researchSources');
    if(j.sources && j.sources.length){
      const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='verify edition:'; rs.appendChild(lbl);
      j.sources.forEach(s=>{ const a=document.createElement('a'); a.href=s.url; a.target='_blank'; a.rel='noopener'; a.textContent=s.name; rs.appendChild(a); });
    }
  }catch(e){ $('researchOut').textContent='lookup failed — is serve.py running?'; }
}
function addResearch(){
  if(cur<0||!lastResearch||!lastResearch.text) return;
  const b=DATA.books[cur];
  (b.research=b.research||[]).push({ text:lastResearch.text, source:lastResearch.source||'', fetched_at:new Date().toISOString().slice(0,10) });
  renderResearch(b); $('researchAdd').style.display='none'; markDirty();
}

// ---- settings / theme ----
function hexOk(s){ return /^#[0-9a-fA-F]{6}$/.test(s); }
function syncColor(colorId, hexId){
  $(colorId).addEventListener('input', ()=>{ $(hexId).value=$(colorId).value; });
  $(hexId).addEventListener('input', ()=>{ if(hexOk($(hexId).value)) $(colorId).value=$(hexId).value; });
}
function wireEyedropper(btnId, colorId, hexId){
  const btn=$(btnId);
  if(!window.EyeDropper){ btn.style.display='none'; return; }
  btn.onclick=async()=>{ try{ const r=await new EyeDropper().open(); $(colorId).value=r.sRGBHex; $(hexId).value=r.sRGBHex; }catch(e){} };
}
function openSettings(){
  const t=(state.series&&state.series.theme)||{};
  $('themeSeries').textContent=(state.series&&state.series.label)||'this series';
  const transparent = !t.bg || t.bg==='transparent';
  $('bgTransparent').checked=transparent;
  $('bgColor').value = (t.bg && t.bg!=='transparent') ? t.bg : '#0c0e13';
  $('bgHex').value = $('bgColor').value;
  $('accentColor').value = t.accent || '#e23636';
  $('accentHex').value = $('accentColor').value;
  $('overlay').classList.add('show');
}
function closeSettings(){ $('overlay').classList.remove('show'); }
async function saveTheme(){
  if(!state.series){ alert('No series selected.'); return; }
  const theme = { bg: $('bgTransparent').checked ? 'transparent' : $('bgColor').value,
                  accent: $('accentColor').value };
  try{
    const r=await fetch('/api/theme?series='+encodeURIComponent(state.series.id),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(theme)});
    if(!r.ok) throw new Error(await r.text());
    state.series.theme=theme; closeSettings(); toast();
    document.documentElement.style.setProperty('--hero', theme.accent);  // live preview of accent
  }catch(e){ alert('Could not save colors: '+e.message); }
}

// ---- save / re-import ----
function toast(){ const s=$('saved'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),1800); }

async function saveAll(){
  if(cur>=0) collect();
  const q = state.series ? ('?series='+encodeURIComponent(state.series.id)) : '';
  try{
    const r=await fetch('/save'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});
    if(!r.ok) throw new Error(await r.text());
    clearDirty(); toast();
    dirtySnapshot=cur>=0?JSON.parse(JSON.stringify(DATA.books[cur])):null;
    renderList($('search').value.toLowerCase());
  }catch(e){ alert('Save failed — is serve.py running?\\n\\n'+e.message); }
}

async function reimport(){
  if(!state.series){ alert('No series selected.'); return; }
  if(state.dirty && !confirm('You have unsaved changes that a re-import may overwrite. Continue?')) return;
  if(!confirm('Re-import '+state.series.label+' from its CLZ export?\\nYour enrichment, order and notes are preserved.')) return;
  $('reimportBtn').textContent='…working';
  try{
    const r=await fetch('/api/rebuild?series='+encodeURIComponent(state.series.id),{method:'POST'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.output||j.error||'rebuild failed');
    alert('Re-import done:\\n\\n'+j.output);
    await loadSeries(state.series.id);   // reload the refreshed data
  }catch(e){ alert('Re-import failed:\\n\\n'+e.message); }
  finally{ $('reimportBtn').textContent='↻ Re-import'; }
}

// ---- boot / series ----
async function loadSeries(id){
  const entry = state.manifest.find(e=>e.id===id) || state.manifest[0] || null;
  state.series = entry;
  const file = entry ? 'data/'+entry.file : 'data/books.json';
  DATA = await (await fetch(file)).json();
  state.DATA = DATA; cur=-1; clearDirty();
  $('sub').textContent = `${(entry&&entry.label)||DATA.series} · ${DATA.books.length} books`;
  $('form').style.display='none'; $('actions').style.display='none'; $('eTitle').textContent='Select a book';
  renderList();
}

function populateSeriesSelect(){
  const sel=$('seriesSel');
  if(!state.manifest.length){ sel.style.display='none'; return; }
  sel.innerHTML='';
  state.manifest.forEach(e=>{ const o=document.createElement('option'); o.value=e.id; o.textContent=e.label; sel.appendChild(o); });
  sel.value=state.series? state.series.id : state.manifest[0].id;
  sel.onchange=async()=>{
    if(state.dirty && !confirm('Switch series? Unsaved changes will be lost.')){ sel.value=state.series.id; return; }
    await loadSeries(sel.value);
  };
}

$('search').addEventListener('input',e=>renderList(e.target.value.toLowerCase()));
$('coverFile').addEventListener('change', onCoverFile);
$('fCover').addEventListener('change', ()=>{ showCoverPreview($('fCover').value.trim(), false); markDirty(); });   // keep preview in sync if the path is typed/edited
['fPodNick','fPodStojr'].forEach(id=>$(id).addEventListener('input',()=>{ updatePodCombined(); markDirty(); }));
['fPodAired','fPodYoutube'].forEach(id=>$(id).addEventListener('input',markDirty));
$('fPodCovered').addEventListener('change',()=>{ togglePodFields(); markDirty(); });
document.querySelectorAll('input[name=nsMode]').forEach(r=>r.addEventListener('change',()=>{
  $('nsClz').style.display = document.querySelector('input[name=nsMode]:checked').value==='clz' ? '' : 'none';
}));
syncColor('bgColor','bgHex'); syncColor('accentColor','accentHex');
wireEyedropper('bgEye','bgColor','bgHex'); wireEyedropper('accentEye','accentColor','accentHex');

(async function boot(){
  if(location.protocol==='file:'){ $('sub').textContent='Open via start.bat / serve.py (not the file directly)'; return; }
  try{
    try{ state.manifest = await (await fetch('data/series.json')).json(); }catch(e){ state.manifest=[]; }
    const wantId = new URLSearchParams(location.search).get('series');
    const startId = (state.manifest.find(e=>e.id===wantId)||state.manifest[0]||{}).id;
    await loadSeries(startId);
    populateSeriesSelect();
  }catch(e){ $('sub').textContent='data not found — run serve.py'; }
})();
</script>
</body>
